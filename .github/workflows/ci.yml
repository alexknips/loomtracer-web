name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # The web UI (web/) and the bundle format it reads (packages/reasoning/) are one npm workspace at
  # the repository root. This builds and tests it; the browser tests (web/e2e) start a scratch
  # `loomtracer serve` and need a Playwright Chromium, so they run on demand with
  # scripts/e2e-pinned.sh against the release named in LOOMTRACER_VERSION.
  web:
    name: Web UI (build and unit tests)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=web

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
